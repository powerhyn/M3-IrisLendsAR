# IrisLensSDK Android - Gradle Properties
#
# Gradle 빌드 최적화 및 Android 설정
#
# @version 1.0.0

# =============================================================================
# Android 설정
# =============================================================================

# AndroidX 마이그레이션
android.useAndroidX=true

# Jetifier (레거시 라이브러리 AndroidX 변환)
android.enableJetifier=true

# Non-transitive R class (빌드 성능 향상)
android.nonTransitiveRClass=true

# =============================================================================
# Gradle 성능 최적화
# =============================================================================

# JVM 메모리 설정 (NDK 빌드에 충분한 메모리 필요)
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# 병렬 빌드 활성화
org.gradle.parallel=true

# 설정 캐시 (Gradle 8.x)
org.gradle.configuration-cache=true

# 빌드 캐시
org.gradle.caching=true

# 증분 빌드
org.gradle.incremental=true

# =============================================================================
# NDK 빌드 설정
# =============================================================================

# NDK 병렬 빌드 (CPU 코어 수에 맞게 조정)
android.native.buildOutput=verbose

# CMake 병렬 빌드
android.experimental.cacheCompileLibResources=true

# =============================================================================
# Kotlin 설정
# =============================================================================

# Kotlin 코드 스타일
kotlin.code.style=official

# Kotlin 증분 컴파일
kotlin.incremental=true

# =============================================================================
# 버전 정보 (빌드 스크립트에서 참조)
# =============================================================================

# SDK 버전
IRIS_SDK_VERSION_NAME=1.0.0
IRIS_SDK_VERSION_CODE=1

# 타겟 SDK 버전
COMPILE_SDK_VERSION=34
MIN_SDK_VERSION=24
TARGET_SDK_VERSION=34

# NDK 버전 (선택적 - Android Studio에서 자동 감지)
# NDK_VERSION=26.1.10909125
